[package]
name = "difflens"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Real semantic alignment ships in the packaged app: the e5-small ONNX
# model + tokenizer are bundled via tauri.conf.json resources and
# pipeline::default_embedder falls back to the deterministic fake only if
# the model fails to load at runtime.
difflens-core = { path = "../core", features = ["embeddings-ort"] }

[dev-dependencies]
# Headless command-layer tests (execute_job persistence, report writing).
tempfile = "3"

[lib]
name = "difflens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Real embedding inference (bundled e5-small ONNX). Opt-in until phase-09
# wires release bundling; without it the app falls back to the fake embedder
# (DiffResult::embeddings_used = false).
embeddings-ort = ["difflens-core/embeddings-ort"]
