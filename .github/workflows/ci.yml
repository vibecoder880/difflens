name: CI

# Third-party actions are pinned to commit SHAs (supply-chain
# hygiene; renovate/dependabot can bump). Re-resolve the ref before
# updating: gh api repos/<owner>/<repo>/commits/<ref>

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag: v5.0.0 (node24-native)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # tag: stable branch head
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag: v2.9.3
        with:
          workspaces: core

      - name: Stage PDFium for pdf extraction tests
        run: |
          scripts/fetch-pdfium.sh
          echo "DIFFLENS_PDFIUM_PATH=$PWD/resources/binaries/pdfium/lib/libpdfium.so" >> "$GITHUB_ENV"
          echo "DIFFLENS_PDFIUM_STRICT=1" >> "$GITHUB_ENV"

      - name: Install Tesseract for OCR e2e tests (phase 06)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie
          tesseract --version | head -1
          tesseract --list-langs | grep -q vie
          echo "DIFFLENS_OCR_STRICT=1" >> "$GITHUB_ENV"

      - name: rustfmt
        run: cargo fmt --check -p difflens-core

      - name: clippy (no features)
        run: cargo clippy -p difflens-core --all-targets -- -D warnings

      - name: tests (no features; deterministic fake embedder)
        run: cargo test -p difflens-core

      - name: OCR e2e (ignored locally, runs here)
        run: |
          cargo test -p difflens-core --test ocr_tests -- --ignored --nocapture 2>&1 | tee /tmp/ocr-tests.log
          grep -q "ocr-ci-ok" /tmp/ocr-tests.log

      - name: Assert pdf extraction tests actually ran (not skipped)
        run: |
          cargo test -p difflens-core --test extract_tests pdf -- --nocapture 2>&1 | tee /tmp/pdf-tests.log
          grep -q "pdf-extraction-ok" /tmp/pdf-tests.log

  embeddings:
    name: Embeddings (ort feature, ubuntu only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag: v5.0.0 (node24-native)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # tag: stable branch head
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag: v2.9.3
        with:
          workspaces: core

      - name: Fetch e5-small ONNX test model
        run: scripts/fetch-models.sh --test

      - name: clippy (embeddings-ort)
        # ort-sys downloads prebuilt ONNX Runtime from cdn.pyke.io in its
        # build script with no retry — transient CDN disconnects happen.
        # Retry at the step level; the download restarts on each attempt.
        run: |
          for attempt in 1 2 3; do
            if cargo clippy -p difflens-core --features embeddings-ort --all-targets -- -D warnings; then
              exit 0
            fi
            echo "attempt $attempt failed (ort-sys CDN flake?) — retrying in 15s"
            sleep 15
          done
          exit 1

      - name: ort smoke test (ignored locally, runs here)
        run: |
          for attempt in 1 2 3; do
            if cargo test -p difflens-core --features embeddings-ort -- --ignored embeddings; then
              exit 0
            fi
            echo "attempt $attempt failed — retrying in 15s"
            sleep 15
          done
          exit 1

  shell:
    name: Tauri shell compile (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag: v5.0.0 (node24-native)

      - name: Install Tauri Linux deps
        # Runner apt mirrors intermittently return 503 for whole pools —
        # retry at file level (Acquire::Retries) and step level (loop).
        run: |
          APT_INSTALL="sudo apt-get install -y -o Acquire::Retries=5 libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config"
          for attempt in 1 2 3; do
            sudo apt-get update
            if $APT_INSTALL; then
              exit 0
            fi
            echo "apt attempt $attempt failed (mirror outage?) — retrying in 30s"
            sleep 30
          done
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # tag: stable branch head

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag: v2.9.3

      # tauri-build validates `bundle.resources` globs at compile time —
      # the bundled pdfium library + e5 model must exist even for a plain
      # `cargo check`, so fetch both (same files the release packages).
      - name: Fetch bundled resources (pdfium + e5 model)
        run: |
          bash scripts/fetch-pdfium.sh --bundle linux-x64
          bash scripts/fetch-models.sh --bundle
          ls -la src-tauri/resources/pdfium/ src-tauri/resources/models/e5-small/onnx/

      # tauri.conf.json lists `resources/models/e5-small/**` as a bundle
      # resource, but with the pinned glob 0.3.4 a trailing `/**` only ever
      # yields directories and tauri-utils skips directories when collecting
      # resources — so tauri-build fails with "glob pattern … didn't match
      # any files" even with the model fetched. Override just this compile
      # check with an explicit glob that matches the fetched files (same
      # tree, same files); the real config stays untouched.
      - name: check shell
        env:
          TAURI_CONFIG: >-
            {"bundle":{"resources":["resources/pdfium/*","resources/models/e5-small/onnx/*"]}}
        run: cargo check -p difflens

  egress-audit:
    name: Egress audit (HTTP only in download/)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag: v5.0.0 (node24-native)

      - name: audit network egress
        run: scripts/audit-egress.sh

  llm-smoke:
    name: LLM real roundtrip (llama-server + GGUF, ignored test)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag: v5.0.0 (node24-native)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # tag: stable branch head

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # tag: v2.9.3
        with:
          workspaces: core

      - name: Real roundtrip (pinned llama-server + 0.6B test GGUF via download manager)
        # Downloads go over the public internet (GitHub releases + HF) —
        # retry at the step level for transient CDN flakes.
        run: |
          for attempt in 1 2 3; do
            if cargo test -p difflens-core -- --ignored --nocapture llm_real_roundtrip; then
              exit 0
            fi
            echo "attempt $attempt failed — retrying in 15s"
            sleep 15
          done
          exit 1

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag: v5.0.0 (node24-native)

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # tag: v5.0.0 (node24-native)
        with:
          node-version: 24
          cache: npm

      - name: install
        run: npm ci

      - name: test (vitest — pure logic + EN/VI i18n parity vs backend label keys)
        run: npm test

      - name: build
        run: npm run build
