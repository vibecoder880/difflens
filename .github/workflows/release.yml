name: Release

# Third-party actions are pinned to commit SHAs (supply-chain
# hygiene; renovate/dependabot can bump). Re-resolve the ref before
# updating: gh api repos/<owner>/<repo>/commits/<ref>

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Release ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
            # ONNX Runtime (ort-sys prebuilt) is built against macOS 13.4 —
            # linking with rustc's default min-version 11.0 fails on
            # ___isPlatformVersionAtLeast (older compiler-rt lacks it).
            # Raise the deployment target so compiler-rt matches.
            macosx_deployment_target: "13.0"
          - os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target || '' }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # tag: v5.0.0 (node24-native)

      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871 # tag: main branch head
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # tag: stable branch head
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Tauri Linux deps
        # Runner apt mirrors intermittently return 503 for whole pools —
        # retry at file level (Acquire::Retries) and step level (loop).
        if: matrix.os == 'ubuntu-24.04'
        run: |
          APT_INSTALL="sudo apt-get install -y -o Acquire::Retries=5 libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config"
          for attempt in 1 2 3; do
            sudo apt-get update
            if $APT_INSTALL; then
              exit 0
            fi
            echo "apt attempt $attempt failed (mirror outage?) — retrying in 30s"
            sleep 30
          done
          exit 1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # tag: v5.0.0 (node24-native)
        with:
          node-version: 24
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Fetch runtime resources
        shell: bash
        run: scripts/fetch-models.sh --bundle

      - name: Bundle PDFium for this platform
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest) PLATFORM=win-x64 ;;
            macos-latest)   PLATFORM=mac-arm64 ;;
            *)              PLATFORM=linux-x64 ;;
          esac
          bash scripts/fetch-pdfium.sh --bundle "$PLATFORM"
          ls -la src-tauri/resources/pdfium/

      - name: Build and upload release
        id: tauriBuild
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # tag: v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DiffLens ${{ github.ref_name }}"
          releaseBody: "Local-first document diffing. See README for platform notes (unsigned installers: macOS right-click → Open; Windows SmartScreen → More info → Run)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify PDFium shipped inside the bundles
        shell: bash
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            # NSIS/MSI compress resources into the installer binary (solid
            # archive — file names are compressed too, so binary-grep cannot
            # see them). Proof of inclusion instead: the staged inputs must
            # exist pre-build, and tauri-build itself fails the build when a
            # bundle.resources glob matches no files (observed in the shell
            # compile job). Artifacts must exist post-build.
            test -f src-tauri/resources/pdfium/pdfium.dll || fail "staged pdfium.dll missing pre-build"
            test -f src-tauri/resources/models/e5-small/onnx/model_quantized.onnx || fail "staged e5 model missing pre-build"
            test -f src-tauri/resources/models/e5-small/tokenizer.json || fail "staged tokenizer.json missing pre-build"
            ARTIFACTS=$(find . -type f \( -name "*-setup.exe" -o -name "*.msi" \) -path "*bundle*" 2>/dev/null | head -3)
            echo "installers:"
            echo "$ARTIFACTS"
            [ -n "$ARTIFACTS" ] || fail "no installer artifacts found in bundle dir"
            echo "windows-bundles-ok"
            exit 0
          fi

          # Linux (.AppImage/.deb squash loose resources) and macOS (.app
          # Contents/Resources keeps loose files): search the bundle tree.
          # The Cargo workspace hoists target/ to the repo root — search
          # everywhere under it, wherever tauri-action built.
          echo "PDFium files inside built bundles:"
          FOUND=$(find . -type f \( -name "pdfium.dll" -o -name "libpdfium.so" -o -name "libpdfium.dylib" \) -path "*bundle*" 2>/dev/null | head -5)
          echo "$FOUND"
          [ -n "$FOUND" ] || fail "PDFium library missing from built bundle — packaging regression (v1.0.0/1.0.1 shipped without it)"
          MODEL=$(find . -type f -name "model_quantized.onnx" -path "*bundle*" 2>/dev/null | head -2)
          echo "e5-small model inside built bundles:"
          echo "$MODEL"
          [ -n "$MODEL" ] || fail "e5-small model missing from built bundle — semantic alignment would silently fall back to the fake embedder"
          echo "pdfium-bundled-ok; e5-model-bundled-ok"
