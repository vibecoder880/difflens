name: Release

# Third-party actions are pinned to commit SHAs (supply-chain
# hygiene; renovate/dependabot can bump). Re-resolve the ref before
# updating: gh api repos/<owner>/<repo>/commits/<ref>

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Release ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # tag: v4.4.0

      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-24.04'
        uses: jlumbroso/free-disk-space@cf1e78c50ca91e757bab3edc229027eebfc07871 # tag: main branch head
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # tag: stable branch head
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Tauri Linux deps
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # tag: v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Fetch runtime resources (guarded until phase-03/05 scripts exist)
        shell: bash
        run: |
          if [ -f scripts/fetch-models.sh ]; then
            scripts/fetch-models.sh --bundle
          else
            echo "scripts/fetch-models.sh not present yet; bundling without pre-fetched resources"
          fi

      - name: Build and upload release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # tag: v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DiffLens ${{ github.ref_name }}"
          releaseBody: "Local-first document diffing. See README for platform notes (unsigned installers: macOS right-click → Open; Windows SmartScreen → More info → Run)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
