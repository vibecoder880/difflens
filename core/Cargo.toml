[package]
name = "difflens-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DiffLens core: extraction, diff, alignment, heuristics, LLM sidecar, OCR"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
zip.workspace = true
roxmltree.workspace = true
calamine.workspace = true
similar.workspace = true
strsim.workspace = true
ureq = { version = "2", features = ["json", "gzip"] }
sha2 = "0.10"
hex = "0.4"
# CSPRNG for the per-session llama-server API key (review P2-10).
# MIT OR Apache-2.0 — consistent with the workspace licensing.
getrandom = "0.3"
# OCR temp images: NamedTempFile (0600 perms on unix, Drop-cleanup).
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"

# Download manager archive extraction (llama-server bundles are .tar.gz /
# .zip). flate2 uses the pure-Rust miniz_oxide backend by default.
flate2 = "1"
tar = "0.4"

# Optional: real embedding inference (onnxruntime). Tests and default builds
# use the deterministic fake embedder so the 3-core CI/dev VM stays fast.
# Pin: ort =2.0.0-rc.15 (wraps ONNX Runtime ~1.31), tokenizers 0.23.2 stable.
ort = { version = "=2.0.0-rc.15", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["onig"] }

# Runtime-bound PDFium bindings (library loaded via scripts/fetch-pdfium.sh).
# Trimmed features: text extraction only — no image/bitmap deps.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
unicode-normalization = "0.1"

[features]
default = []
embeddings-ort = ["ort", "tokenizers"]

[dev-dependencies]
serde_json.workspace = true
# Integration tests craft zip/tar.gz fixtures with the same crates the
# library uses.
zip.workspace = true
